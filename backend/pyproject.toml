[project]
name = "financetg-backend"
version = "0.1.0"
description = "Telegram Mini App для совместного учёта финансов"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiogram>=3.15",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "apscheduler>=3.10",
    "google-api-python-client>=2.150",
    "google-auth>=2.36",
    # База часовых поясов для zoneinfo: в slim-образе системной может не быть,
    # и напоминания молча уехали бы на UTC
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 — вызов Query()/Depends() в значении по умолчанию: это идиома FastAPI, а не ошибка
ignore = ["B008"]
