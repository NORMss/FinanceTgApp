services:
  app:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/app.db
      GOOGLE_CREDENTIALS_FILE: /data/google-credentials.json
    volumes:
      - ./data:/data
    expose:
      - "8000"
    healthcheck:
      # Лёгкая проба на голом сокете: она запускается внутри контейнера и её память
      # считается в тот же лимит, что и у приложения (см. app/healthcheck.py)
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          # Один только импорт зависимостей (aiogram тянет больше сотни мегабайт) —
          # это уже около 220 МБ, под нагрузкой процесс встаёт на ~260-280 МБ. Прежние
          # 384 МБ оставляли запас меньше сотни: контейнер время от времени получал
          # OOM и уходил в перезапуск, а пока он поднимался, прокси отвечал 502 на
          # каждый запрос Mini App. Занижать это значение, не померив `docker stats`,
          # не стоит.
          memory: ${APP_MEMORY_LIMIT:-512M}

  # Разовая сборка фронта: docker compose --profile build run --rm frontend
  # Результат ложится в ./frontend/dist, откуда его отдаёт Caddy.
  frontend:
    image: node:22-alpine
    profiles: ["build"]
    working_dir: /src
    volumes:
      - ./frontend:/src
    command: sh -c "npm ci --no-audit --no-fund && npm run build"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      # Домен для автоматического TLS. Для локальной проверки: DOMAIN=:80
      DOMAIN: ${DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/www:ro
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  caddy_data:
  caddy_config:
